name: Convert models
on: workflow_dispatch
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Tai trong so tu Release "models"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p models_src
          gh release download models --dir models_src --clobber
          ls -la models_src
      - name: Cai thu vien
        run: |
          pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install onnx onnxruntime numpy pillow einops timm==0.9.16
      - name: Chuyen doi va kiem tra bang anh test
        run: python tools/convert_models.py models_src out
      - uses: actions/upload-artifact@v4
        with:
          name: onnx-models-and-report
          path: out
      - name: Dua ONNX len Release models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls out/*.onnx && gh release upload models out/*.onnx --clobber || echo "Khong co file ONNX nao hop le de dua len"
